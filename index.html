<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#8b5a3c"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>إدارة الكافيه</title>
<style>
:root{--bg:#faf5ee;--card:#fff;--tx:#3b2a20;--mut:#8a7565;--pr:#8b5a3c;--prt:#fff;--bd:#eadfd2;--red:#c8443a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--card:#2a1f19;--tx:#f3e8dc;--mut:#b49c88;--pr:#d9a066;--prt:#2a1608;--bd:#3d2e24;--red:#ef7b6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1410;--card:#2a1f19;--tx:#f3e8dc;--mut:#b49c88;--pr:#d9a066;--prt:#2a1608;--bd:#3d2e24;--red:#ef7b6e;color-scheme:dark}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Tahoma,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:auto;padding:12px 14px 90px}
h1{font-size:20px;margin:6px 0}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.k{color:var(--mut);font-size:13px}.v{font-size:21px;font-weight:700}
input,select{width:100%;box-sizing:border-box;font:inherit;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--pr);color:var(--prt);font-weight:600}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd)}button.d{background:transparent;color:var(--red);padding:4px 8px}
button.big{width:100%;padding:22px;font-size:20px}button.w{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.pos{color:var(--pr)}.neg{color:var(--red)}.sm{font-size:13px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mut);padding:8px 2px;font-size:13px}nav button.on{color:var(--pr)}
#t{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:9}
#bn{position:fixed;top:0;left:0;right:0;z-index:20;display:none;background:var(--pr);color:var(--prt);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;font-size:19px;font-weight:700;text-align:center}.hero{position:relative;background:linear-gradient(135deg,var(--pr),#c98f5a);color:var(--prt);border-radius:0 0 30px 30px;padding:34px 18px 26px;margin:-12px -14px 14px;text-align:center}.hero h1{font-size:26px}
.adm{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.22);color:inherit;font-size:12px;padding:6px 12px;border-radius:16px;backdrop-filter:blur(6px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:8px 18px;border-radius:20px;font-size:14px;font-weight:500}.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mi{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px 8px;text-align:center;box-shadow:0 3px 12px rgba(90,55,25,.08)}.mi .e{font-size:44px;line-height:1.2}
.cb{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:14px}.cb button{box-shadow:0 6px 18px rgba(90,55,25,.3);padding:16px;font-size:17px;border-radius:16px}
.card{box-shadow:0 2px 10px rgba(90,55,25,.06)}.err{color:var(--red);min-height:22px}.c{text-align:center}.q{display:flex;align-items:center;gap:10px}.q button{padding:4px 14px;font-size:20px}.st{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--bd)}
</style></head><body><div id="app"><p class="c sm">جاري التحميل…</p></div><div id="t"></div><div id="bn" onclick="this.style.display='none'"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=['users','att','ent','menu','ord','days'];let S={},db=null,me=null,tab='',loaded={},ready=false,mon=null,usingDb=true,cart={},tbl='',nt='',seen=null,stat={},cat='',showLogin=false,custDone=null;K.forEach(k=>S[k]=[]);try{const m=location.hash.match(/^#t(.+)/);if(m)tbl=decodeURIComponent(m[1])}catch(e){}
const lsG=k=>{try{return JSON.parse(localStorage.getItem('cf_'+k))||[]}catch(e){return[]}},lsS=(k,v)=>{try{localStorage.setItem('cf_'+k,JSON.stringify(v))}catch(e){}};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const tm=ms=>new Date(ms).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),money=n=>(+n||0).toLocaleString('ar-EG')+' ج';
const hrs=a=>((a.out||Date.now())-a.in)/36e5,hf=h=>Math.floor(h)+'س '+Math.round(h%1*60)+'د',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2200)}
function notify(m){const b=$('#bn');b.textContent=m;b.style.display='block';try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.frequency.value=1175},180);setTimeout(()=>{o.stop();c.close()},420)}catch(e){}}
function watch(){if(!S.ord)return;if(seen===null){seen=new Set(S.ord.map(o=>o.id));S.ord.forEach(o=>stat[o.id]=o.status);return}
 S.ord.forEach(o=>{if(!seen.has(o.id)){seen.add(o.id);if(me&&o.uid!==me.id&&o.status==='new')notify('🔔 ترابيزة '+o.table+' طلبت أوردر')}
 if(stat[o.id]&&stat[o.id]!==o.status&&o.status==='ready'&&me&&o.uid===me.id)notify('✅ طلب ترابيزة '+o.table+' جاهز');stat[o.id]=o.status})}
let token=null,hasUsers=null,es=null,tk=null;try{token=localStorage.getItem('cf_tok')}catch(e){}
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok){if(r.status===401&&token&&p!=='/login')logout();throw new Error(j.error||'حصل خطأ')}return j}
async function call(m,p,b){try{return await api(m,p,b)}catch(e){toast(e.message);return null}}
async function refresh(){try{const r=await api('GET','/state');Object.assign(S,r.state);render()}catch(e){}}
function live(){if(es)es.close();es=new EventSource('/api/events?t='+encodeURIComponent(token));es.onmessage=e=>{try{Object.assign(S,JSON.parse(e.data));if(ready){watch();soft()}}catch(x){}}}
async function init(){try{hasUsers=(await api('GET','/info')).hasUsers;S.menu=(await api('GET','/menu')).menu||[]}catch(e){$('#app').innerHTML='<p class="c sm">تعذر الاتصال بالسيرفر</p>';return}
 if(token){try{const r=await api('GET','/state');me=r.me;Object.assign(S,r.state);tab=me.role==='admin'?'home':'new';live()}catch(e){token=null}}
 ready=true;watch();render()}
async function boot(){const r=await api('GET','/state');me=r.me;Object.assign(S,r.state);tab=me.role==='admin'?'home':'new';showLogin=false;seen=null;watch();live();render()}
function soft(){if(me)me=S.users.find(x=>x.id===me.id)||me;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;render()}
const val=id=>($('#'+id)?$('#'+id).value:'').trim();
function err(m){const e=$('#err');if(e)e.textContent=m}
async function enter(path,body){let r;try{r=await api('POST',path,body)}catch(e){return err(e.message)}token=r.token;try{localStorage.setItem('cf_tok',token)}catch(e){}hasUsers=true;await boot()}
const login=()=>enter('/login',{user:val('u').toLowerCase(),pass:$('#p').value});
const setup=()=>enter('/setup',{name:val('n'),user:val('u').toLowerCase(),pass:$('#p').value});
function logout(){token=null;me=null;showLogin=false;if(es)es.close();try{localStorage.removeItem('cf_tok')}catch(e){}K.forEach(k=>{if(k!=='menu')S[k]=[]});render()}
async function addEmp(){if(await call('POST','/users',{name:val('n'),user:val('u'),pass:$('#p').value,salary:val('s')}))render()}
async function setPw(id){if(await call('POST','/users/'+id+'/pw',{pass:$('#np_'+id).value}))toast('تم تغيير الباسورد')}
function del(k,id,b){if(!b.dataset.c){b.dataset.c=1;b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.c='';b.textContent='حذف'},2500);return}call('DELETE',k==='users'?'/users/'+id:k==='menu'?'/menu/'+id:'/rec/'+k+'/'+id).then(refresh)}
async function punch(){if(await call('POST','/punch'))toast('تم')}
async function addItem(){if(await call('POST','/menu',{n:val('n'),p:val('p'),c:val('c'),e:val('e')}))await refresh()}
function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];render()}
const total=o=>o.items.reduce((a,i)=>a+i.p*i.q,0);
async function send(){const t=val('tb')||tbl;if(!t)return toast('اكتب رقم الترابيزة');const items=Object.keys(cart).map(id=>({id,q:cart[id]}));if(!items.length)return toast('اختار أصناف');
 const r=await call('POST','/order',{table:t,items,note:nt});if(!r)return;cart={};nt='';if(me){tbl='';tab='ord';toast('تم إرسال الطلب');await refresh()}else{custDone=r.id;S.ord=[{id:r.id,table:t,status:'new'}];track()}render()}
function track(){clearInterval(tk);tk=setInterval(async()=>{if(!custDone)return clearInterval(tk);try{const o=await api('GET','/order/'+custDone);S.ord=[{id:custDone,table:o.table,status:o.status}];if(!$('#tb'))render()}catch(e){}},4000)}
function setCat(i){cat=i<0?'':[...new Set(S.menu.map(m=>m.c))][i];render()}
function hero(){return`<div class="hero"><button class="adm" onclick="showLogin=true;render()">🔐 الموظفين</button><div style="font-size:48px">☕</div><h1 style="margin:4px 0">أهلاً بيك</h1><div style="opacity:.9">اختار طلبك وهيوصلك لحد الترابيزة</div></div>`}
function menuUI(st){const cats=[...new Set(S.menu.map(m=>m.c))],L=S.menu.filter(m=>!cat||m.c===cat),tt=Object.keys(cart).reduce((a,id)=>{const m=S.menu.find(x=>x.id===id);return a+(m?m.p*cart[id]:0)},0),n=Object.values(cart).reduce((a,b)=>a+b,0);
 return`<div class="chips"><button class="chip ${!cat?'on':''}" onclick="setCat(-1)">الكل</button>${cats.map((x,i)=>`<button class="chip ${x===cat?'on':''}" onclick="setCat(${i})">${esc(x)}</button>`).join('')}</div>
 <div class="mg">${L.map(m=>`<div class="mi"><div class="e">${esc(m.e||'☕')}</div><b>${esc(m.n)}</b><div class="sm">${money(m.p)}</div><div class="q" style="justify-content:center;margin-top:10px"><button onclick="qty('${m.id}',-1)">−</button><b>${cart[m.id]||0}</b><button onclick="qty('${m.id}',1)">+</button></div></div>`).join('')}</div>
 <div class="card" style="margin-top:14px"><input id="tb" placeholder="رقم الترابيزة" value="${esc(tbl)}" oninput="tbl=this.value"><input id="nt" placeholder="ملاحظات (سكر زيادة...)" value="${esc(nt)}" oninput="nt=this.value"></div>
 <div class="cb" ${st?'style="bottom:76px"':''}><button class="w" onclick="send()">${n?'إرسال الطلب · '+n+' · '+money(tt):'اختار أصنافك'}</button></div>`}
function cust(){if(custDone){const o=S.ord.find(x=>x.id===custDone),m={new:'تم استلام طلبك ⏳',prep:'طلبك بيتحضر 👨‍🍳',ready:'طلبك جاهز! 🎉',served:'بالهنا والشفا 😋',paid:'شكراً لزيارتك 💛'};
  return hero()+`<div class="card c"><div class="k">ترابيزة</div><div class="v">${esc(o?o.table:'')}</div><p style="font-size:20px">${o?m[o.status]:'شكراً لزيارتك 💛'}</p><button class="w" onclick="custDone=null;render()">اطلب حاجة تانية</button></div>`}
 return hero()+(S.menu.length?menuUI(0):'<div class="card c sm">المينيو هيتضاف قريب</div>')}
const NX={new:['prep','ابدأ التحضير'],prep:['ready','جاهز'],ready:['served','تم التسليم'],served:['paid','قفل الحساب']},LB={new:'جديد',prep:'بيتحضر',ready:'جاهز',served:'اتسلم'};
const adv=id=>call('POST','/order/'+id+'/advance').then(refresh);
async function addExp(){if(await call('POST','/expense',{amt:val('a'),note:val('xn')}))await refresh()}
const name=id=>id==='guest'?'زبون':(S.users.find(x=>x.id===id)||{name:'(محذوف)'}).name;
const sd=p=>S.days.filter(d=>d.date.startsWith(p)).reduce((a,d)=>a+d.amt,0),ex=p=>S.ent.filter(e=>e.date.startsWith(p)).reduce((a,e)=>a+ +e.amt,0);
function mpick(){return`<input type="month" id="mo" value="${mon}" onchange="mon=this.value||mon;render()">`}
const V={
home(){const t=today(),m=t.slice(0,7),op=S.ord.filter(o=>o.status!=='paid').length,on=S.att.filter(a=>!a.out),cnt={};
 S.ord.filter(o=>o.status==='paid').forEach(o=>o.items.forEach(i=>cnt[i.n]=(cnt[i.n]||0)+i.q));const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return`<div class="grid"><div class="card"><div class="k">مبيعات اليوم</div><div class="v pos">${money(sd(t))}</div></div><div class="card"><div class="k">مصروفات اليوم</div><div class="v neg">${money(ex(t))}</div></div><div class="card"><div class="k">صافي الشهر</div><div class="v">${money(sd(m)-ex(m))}</div></div><div class="card"><div class="k">طلبات مفتوحة</div><div class="v">${op}</div></div></div>
 <h2>الأكتر مبيعاً (آخر 30 يوم)</h2><div class="card">${top.map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<span class="sm">لسه مفيش بيانات</span>'}</div>
 <h2>الموجودين دلوقتي (${on.length})</h2><div class="card">${on.map(a=>`<div class="row"><b>${esc(name(a.uid))}</b><span class="sm">من ${tm(a.in)}</span></div>`).join('')||'<span class="sm">مفيش حد حاضر</span>'}</div>
 <h2>مصروف جديد</h2><div class="card"><input id="a" type="number" inputmode="decimal" placeholder="المبلغ"><input id="xn" placeholder="البند (خامات، فواتير...)"><button class="w" onclick="addExp()">إضافة</button>${S.ent.filter(e=>e.date===t).map(e=>`<div class="row"><span class="neg">−${money(e.amt)} <span class="sm">${esc(e.note)}</span></span><button class="d" onclick="del('ent','${e.id}',this)">حذف</button></div>`).join('')}</div>`},
new(){return S.menu.length?menuUI(1):`<div class="card c sm">المينيو فاضي. ${me.role==='admin'?'ضيف أصناف من تبويب المينيو.':'اطلب من الأدمن يضيف أصناف.'}</div>`},
ord(){const L=S.ord.filter(o=>o.status!=='paid').sort((a,b)=>a.t-b.t);
 return L.map(o=>`<div class="card"><div class="top"><b style="font-size:18px">ترابيزة ${esc(o.table)}</b><span class="st">${LB[o.status]}</span></div><div class="sm">${tm(o.t)} · ${esc(name(o.uid))}</div>${o.items.map(i=>`<div class="row"><span>${i.q} × ${esc(i.n)}</span><span class="sm">${money(i.p*i.q)}</span></div>`).join('')}${o.note?`<div class="sm">📝 ${esc(o.note)}</div>`:''}<div class="top" style="margin-top:8px"><b>${money(total(o))}</b><span>${me.role==='admin'?`<button class="d" onclick="del('ord','${o.id}',this)">حذف</button>`:''}<button onclick="adv('${o.id}')">${NX[o.status][1]}</button></span></div></div>`).join('')||'<div class="card c sm">مفيش طلبات دلوقتي</div>'},
menu(){return`<div class="card"><b>إضافة صنف</b><input id="n" placeholder="اسم الصنف"><input id="p" type="number" inputmode="decimal" placeholder="السعر"><input id="e" placeholder="إيموجي (☕ 🍰 🥤)" maxlength="4"><input id="c" placeholder="القسم (مشروبات ساخنة، حلويات...)"><button class="w" onclick="addItem()">إضافة</button></div><div class="card">${S.menu.map(m=>`<div class="row"><div><b>${esc(m.e||'☕')} ${esc(m.n)}</b><div class="sm">${esc(m.c)} · ${money(m.p)}</div></div><button class="d" onclick="del('menu','${m.id}',this)">حذف</button></div>`).join('')||'<span class="sm">المينيو فاضي</span>'}</div>`},
att(){const o=S.att.find(a=>a.uid===me.id&&!a.out),L=S.att.filter(a=>a.uid===me.id).sort((a,b)=>b.in-a.in).slice(0,15);
 return`<div class="card c"><div class="sm">${o?'حاضر من '+tm(o.in):'لم تسجل حضور'}</div><br><button class="big" style="${o?'background:var(--red);color:#fff':''}" onclick="punch()">${o?'تسجيل انصراف':'تسجيل حضور'}</button></div><h2>آخر سجلاتك</h2><div class="card">${L.map(a=>`<div class="row"><span>${a.date}</span><span class="sm">${tm(a.in)} → ${a.out?tm(a.out):'…'}</span><b>${hf(hrs(a))}</b></div>`).join('')||'<span class="sm">لا توجد سجلات</span>'}</div>`},
atta(){const R=S.att.filter(a=>a.date.startsWith(mon)).sort((a,b)=>b.in-a.in),E=S.users.filter(u=>u.role==='emp');
 return`${mpick()}<h2>ملخص الشهر</h2><div class="card">${E.map(u=>{const r=R.filter(a=>a.uid===u.id),d=new Set(r.map(a=>a.date)).size,h=r.reduce((s,a)=>s+hrs(a),0);return`<div class="row"><div><b>${esc(u.name)}</b><div class="sm">${d} يوم · ${hf(h)}</div></div><div class="sm">مستحق تقريبي<br><b>${money(u.salary/30*d)}</b></div></div>`}).join('')||'<span class="sm">لا يوجد موظفين</span>'}</div>
 <h2>السجلات</h2><div class="card">${R.map(a=>`<div class="row"><div><b>${esc(name(a.uid))}</b><div class="sm">${a.date} · ${tm(a.in)} → ${a.out?tm(a.out):'لسه حاضر'}</div></div><span>${hf(hrs(a))}</span><button class="d" onclick="del('att','${a.id}',this)">حذف</button></div>`).join('')||'<span class="sm">لا توجد سجلات</span>'}</div>`},
emp(){const E=S.users.filter(u=>u.role==='emp');
 return`<div class="card"><b>إضافة موظف</b><input id="n" placeholder="الاسم"><input id="u" placeholder="اليوزر (إنجليزي)" autocapitalize="none" autocomplete="off"><input id="p" type="text" placeholder="كلمة السر" autocomplete="off"><input id="s" type="number" inputmode="decimal" placeholder="الراتب الشهري"><button class="w" onclick="addEmp()">إضافة</button></div>
 ${E.map(u=>`<div class="card"><div class="row" style="border:0"><div><b>${esc(u.name)}</b><div class="sm">${esc(u.user)} · ${money(u.salary)}</div></div><button class="d" onclick="del('users','${u.id}',this)">حذف</button></div><div style="display:flex;gap:6px"><input id="np_${u.id}" placeholder="باسورد جديد"><button class="g" onclick="setPw('${u.id}')">تغيير</button></div></div>`).join('')}`}};
const TABS={admin:[['home','الرئيسية'],['ord','الطلبات'],['new','طلب جديد'],['menu','المينيو'],['atta','الحضور'],['emp','الموظفين']],emp:[['new','طلب جديد'],['ord','الطلبات'],['att','حضوري']]};
function render(){const A=$('#app');if(!ready)return;mon=mon||today().slice(0,7);
 if(hasUsers===false){A.innerHTML=`<h1>☕ إعداد الكافيه</h1><div class="card"><p class="sm">أنشئ حساب الأدمن (صاحب الكافيه)</p><input id="n" placeholder="اسمك"><input id="u" placeholder="اليوزر" autocapitalize="none"><input id="p" type="password" placeholder="كلمة السر"><div class="err" id="err"></div><button class="w" onclick="setup()">إنشاء</button></div>`;return}
 if(!me&&!showLogin){A.innerHTML=cust();return}
 if(!me){A.innerHTML=`<h1 class="c" style="margin-top:40px">🔐 دخول الموظفين</h1><div class="card"><input id="u" placeholder="اليوزر" autocapitalize="none" autocomplete="username"><input id="p" type="password" placeholder="كلمة السر" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div class="err" id="err"></div><button class="w" onclick="login()">دخول</button><button class="g w" style="margin-top:8px" onclick="showLogin=false;render()">← رجوع للمينيو</button></div>`;return}
 const T=TABS[me.role];if(!V[tab])tab=T[0][0];A.innerHTML=`<div class="top"><div><h1>أهلاً ${esc(me.name)}</h1><div class="sm">${me.role==='admin'?'أدمن':'موظف'} · ${new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}</div></div><button class="g" onclick="logout()">خروج</button></div>${V[tab]()}<nav>${T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav>`}
init();
</script></body></html>
